<!doctype html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Adventi Kalendárium</title>

        <!--STÍLUS-->
        <style>
            body {
                margin: 0;
                background: #f7f6f3;
                /* off-white */
            }

            #snow {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                z-index: -1;
                /* behind content */
                pointer-events: none;

                /* not interactive */
            }

            #calendar {
                display: grid;
                gap: 1rem;
                max-width: 1000px;
                margin: 2rem auto;
                perspective: 1000px;
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }

            .window {
                position: relative;
                height: 140px;
                /* balanced size */

                transform-style: preserve-3d;
                transition: transform 0.8s ease;
                overflow: hidden;
            }

            .window-face {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0.5rem;
                font-weight: bold;
                font-size: 0.95rem;
                text-align: center;
                border: 2px solid #999;
                border-radius: 8px;
                backface-visibility: hidden;

                /* Prevent overflow */
                word-wrap: break-word;
                overflow-wrap: break-word;
                white-space: normal;
                /* allow wrapping */
                overflow: hidden;
                /* hide overflow */
                text-overflow: ellipsis;
                /* add … if too long */
            }

            .window-face.front {
                background: #ddd;
            }

            .window.openable .window-face.front {
                background: #fffbe6;
                border-color: #cc9900;
                cursor: pointer;
            }

            .window-face.back {
                background: #f7f6f3;
                transform: rotateY(180deg);
            }

            .window.opened {
                transform: rotateY(-160deg);
            }
            #toast {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.75);
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 16px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s ease;
            }

            #toast.show {
                opacity: 1;
            }

            @keyframes shake {
                0% {
                    transform: translateX(0);
                }
                20% {
                    transform: translateX(-4px);
                }
                40% {
                    transform: translateX(4px);
                }
                60% {
                    transform: translateX(-4px);
                }
                80% {
                    transform: translateX(4px);
                }
                100% {
                    transform: translateX(0);
                }
            }

            .window.shake {
                animation: shake 0.4s ease;
            }
            /* Frosted background layer (behind the date) */
            .window.locked::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                backdrop-filter: blur(3px);
                background: rgba(255, 255, 255, 0.25);
                z-index: 1; /* behind text */
                pointer-events: none;
            }

            /* Lock icon (above the date) */
            .window.locked::after {
                content: '🔒';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 32px;
                color: rgba(0, 0, 0, 0.6);
                z-index: 3; /* above text */
                pointer-events: none;
            }

            /* Make sure the date text stays above the blur but below the lock icon */
            .window .front {
                position: relative;
                z-index: 2;
            }
        </style>

        <!--FAVICON-->
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
    <rect width='64' height='64' fill='%23000000'/>
    <polygon points='32,10 20,30 44,30' fill='%23008000'/>
    <polygon points='32,20 16,44 48,44' fill='%23008000'/>
    <polygon points='32,30 12,58 52,58' fill='%23008000'/>
    <rect x='28' y='58' width='8' height='6' fill='%238B4513'/>
  </svg>"
        />

        <!--JAVASCRIPT-->
        <script defer>
            document.addEventListener('DOMContentLoaded', () => {
                const canvas = document.getElementById('snow');
                const ctx = canvas.getContext('2d');

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                const flakes = [];
                const colors = ['#000000', '#7a7a7a'];

                // Step 1: place random dots
                const count = 80;
                for (let i = 0; i < count; i++) {
                    flakes.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: 2 + Math.random() * 2,
                        speed: 0.5 + Math.random() * 1,
                        swayPhase: Math.random() * Math.PI * 2,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }

                function drawFlakes() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (const f of flakes) {
                        ctx.fillStyle = f.color;
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Initial static draw
                drawFlakes();

                // Step 2: animate with downward + pendulum sway
                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (const f of flakes) {
                        f.y += f.speed;
                        f.x += Math.sin(f.swayPhase) * 0.3;
                        f.swayPhase += 0.02;

                        if (f.y > canvas.height + f.size) {
                            f.y = -f.size;
                            f.x = Math.random() * canvas.width;
                        }

                        ctx.fillStyle = f.color;
                        ctx.beginPath();
                        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    requestAnimationFrame(animate);
                }

                // Start animation after a short pause
                setTimeout(() => animate(), 1000);
            });

            document.addEventListener('DOMContentLoaded', () => {
                const endDate = new Date(2026, 11, 24);

                // Your goodies list (any length)
                const goodies = [
                    { label: 'Donkey Photo', link: '#' },
                    { label: 'Mystery Cookie', link: '#' },
                    { label: 'Silly Joke of the Day', link: '#' },
                    { label: 'Hot Chocolate Mix', link: '#' },
                    { label: 'Gingerbread Cookie', link: '#' },
                    { label: 'Mini Candle', link: '#' },
                    { label: 'Winter Tea Blend', link: '#' },
                    { label: 'Snowflake Sticker Pack', link: '#' },
                    { label: 'Cinnamon Sugar Almonds', link: '#' },
                    { label: 'Holiday Story', link: '#' },
                    { label: 'Cozy Socks', link: '#' },
                    { label: 'Mini Puzzle', link: '#' },
                    { label: 'Caramel Treat', link: '#' },
                    { label: 'Hand Cream', link: '#' },
                    { label: 'Mug Warmer', link: '#' },
                    { label: 'Snow Globe', link: '#' },
                    { label: 'Wreath Decoration', link: '#' },
                    { label: 'String Lights', link: '#' },
                    { label: 'Christmas Carols Playlist', link: '#' },
                    { label: 'Movie Night Token', link: '#' },
                    { label: 'Gingerbread Man', link: '#' },
                    { label: 'Santa Hat', link: '#' },
                    { label: 'Reindeer Antlers', link: '#' },
                    { label: 'Snowflake Craft Kit', link: '#' }
                ];

                const calendar = document.getElementById('calendar');
                const today = new Date();

                // Work out the first opening date by subtracting (goodies.length - 1) days from END_DATE
                const firstDate = new Date(endDate);
                firstDate.setDate(endDate.getDate() - (goodies.length - 1));

                goodies.forEach((g, i) => {
                    // Each window’s date = firstDate + i days
                    const winDate = new Date(firstDate);
                    winDate.setDate(firstDate.getDate() + i);

                    const win = document.createElement('div');
                    win.className = 'window';
                    if (!(today >= winDate && today <= END_DATE)) {
                        win.addEventListener('click', () => {
                            const diff = Math.ceil((winDate - today) / (1000 * 60 * 60 * 24));

                            let msg = '';

                            if (diff === 1) {
                                msg = 'Holnap nyílik! 🎁';
                            } else if (diff > 1) {
                                msg = `Még ${diff} nap van hátra! 🎄`;
                            } else {
                                msg = 'Még zárva van! ⛔';
                            }
                        });
                    }
                    function showToast(msg) {
                        const t = document.getElementById('toast');
                        t.textContent = msg;
                        t.classList.add('show');

                        setTimeout(() => t.classList.remove('show'), 2000);
                    }
                    const front = document.createElement('div');
                    front.className = 'window-face front';
                    // Show the unlock date on the closed door
                    front.textContent = winDate.toLocaleDateString('hu-HU', {
                        month: 'short',
                        day: 'numeric'
                    });

                    const back = document.createElement('div');
                    back.className = 'window-face back';
                    // Show the goodie label inside
                    back.textContent = g.label;

                    win.appendChild(front);
                    win.appendChild(back);

                    // Unlock if today >= window’s date AND today <= END_DATE
                    if (!(today >= winDate && today <= END_DATE)) {
                        win.classList.add('locked');

                        win.addEventListener('click', () => {
                            // Shake
                            win.classList.add('shake');
                            setTimeout(() => win.classList.remove('shake'), 400);

                            // Toast message
                            const diff = Math.ceil((winDate - today) / (1000 * 60 * 60 * 24));
                            let msg =
                                diff === 1 ? 'Holnap nyílik! 🎁' : `Még ${diff} nap van hátra! 🎄`;

                            showToast(msg);
                        });
                    }

                    calendar.appendChild(win);
                });
            });
        </script>
    </head>

    <body>
        <!-- Background canvas -->
        <canvas id="snow"></canvas>

        <!-- Tartalom -->
        <h1>Adventi Kalendárium</h1>
        <main>
            <div id="calendar"></div>
            <div id="toast"></div>
        </main>
    </body>
</html>
